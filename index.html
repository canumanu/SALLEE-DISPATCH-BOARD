<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sallee Dispatch Board</title>
<style>
  :root{
    --green-dark:#0e3b2e;
    --green:#14523f;
    --green-light:#1e6b52;
    --gold:#c8a24a;
    --gold-light:#e8d9a8;
    --cream:#f7f4ec;
    --ink:#1c2420;
    --line:#d8d2c0;
    --weekend:#f0e8d0;
    --card-normal:#ffffff;
    --card-spare:#eef3f0;
    --card-vacation:#f5e0d8;
    --card-note:#fff8e0;
    --danger:#a23b2e;
    --ky:#0e3b2e;
    --fl:#8a5a00;
    --ny:#1b3a6b;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);}

  .topbar{
    background:var(--green-dark);
    color:var(--gold-light);
    padding:10px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:60;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .topbar h1{
    font-size:18px;
    letter-spacing:1.5px;
    margin:0;
    color:#fff;
    font-weight:700;
    text-transform:uppercase;
  }
  .topbar h1 span{color:var(--gold);}
  .nav-group{display:flex;align-items:center;gap:6px;margin-left:8px;}
  .range-label{font-size:13px;font-weight:600;color:var(--gold-light);min-width:190px;text-align:center;}
  .btn{
    background:var(--green-light);
    border:1px solid rgba(255,255,255,.15);
    color:#fff;
    padding:7px 12px;
    border-radius:6px;
    font-size:12.5px;
    cursor:pointer;
    font-weight:600;
    white-space:nowrap;
  }
  .btn:hover{background:var(--gold);color:var(--green-dark);}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.3);}
  .btn.ghost:hover{background:rgba(255,255,255,.1);color:#fff;}
  .spacer{flex:1;}
  .status-note{font-size:11px;color:rgba(255,255,255,.55);}

  #topScrollSync{
    overflow-x:auto;
    overflow-y:hidden;
    height:16px;
    background:var(--green-dark);
    border-bottom:2px solid var(--gold);
    position:sticky;
    top:54px;
    z-index:59;
  }
  #topScrollSync::-webkit-scrollbar{height:14px;}
  #topScrollSync::-webkit-scrollbar-track{background:var(--green-dark);}
  #topScrollSync::-webkit-scrollbar-thumb{background:var(--gold);border-radius:7px;border:3px solid var(--green-dark);}
  #topScrollSyncInner{height:1px;}

  .board-wrap{
    overflow:auto;
    height:calc(100vh - 54px);
    position:relative;
  }
  table.board{
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
  }

  .region-spacer{
    position:sticky;top:0;left:0;z-index:35;
    background:var(--green-dark);
    width:84px;min-width:84px;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  th.region-label{
    position:sticky;top:0;z-index:25;
    color:#fff;
    font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    text-align:center;
    padding:5px 0;
    border-bottom:1px solid rgba(255,255,255,.12);
    border-right:2px solid var(--gold);
  }
  th.region-label.region-KY{background:var(--ky);}
  th.region-label.region-FL{background:var(--fl);}
  th.region-label.region-NY{background:var(--ny);}
  th.region-label.region-unassigned{background:#5c5648;}
  .region-end-spacer{
    position:sticky;top:0;z-index:25;
    background:var(--green-dark);
    width:46px;min-width:46px;
    border-bottom:1px solid rgba(255,255,255,.12);
  }

  td.corner-cell{
    position:sticky;top:29px;left:0;z-index:35;
    background:var(--green-dark);
    width:84px;min-width:84px;
    border-bottom:2px solid var(--gold);
    border-right:2px solid var(--gold);
    height:0;
    padding:0;
  }
  th.driver-head{
    position:sticky;top:29px;z-index:20;
    background:var(--green-dark);
    color:#fff;
    width:150px;min-width:150px;
    padding:7px 6px;
    border-bottom:2px solid var(--gold);
    border-right:1px solid rgba(255,255,255,.12);
    text-align:center;
    vertical-align:top;
    cursor:pointer;
    user-select:none;
  }
  th.driver-head:hover{background:var(--green);}
  th.driver-head .dname{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  th.driver-head .dname2{font-size:10.5px;color:var(--gold-light);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  th.driver-head .dtruck{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px;font-family:ui-monospace,Consolas,monospace;}
  .add-driver-cell{
    position:sticky;top:29px;z-index:20;
    background:var(--green-dark);
    width:46px;min-width:46px;
    border-bottom:2px solid var(--gold);
    text-align:center;
    vertical-align:middle;
  }
  .add-driver-cell button{
    background:transparent;border:1.5px dashed var(--gold);color:var(--gold);
    border-radius:6px;width:30px;height:30px;font-size:17px;cursor:pointer;
  }
  .add-driver-cell button:hover{background:var(--gold);color:var(--green-dark);}

  td.date-cell{
    position:sticky;left:0;z-index:15;
    background:var(--cream);
    border-right:2px solid var(--gold);
    border-bottom:1px solid var(--line);
    padding:6px 6px;
    vertical-align:top;
    width:84px;min-width:84px;
  }
  td.date-cell .dow{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--green);}
  td.date-cell .dnum{font-size:15px;font-weight:800;color:var(--ink);}
  td.date-cell.weekend{background:var(--weekend);}
  td.date-cell.weekend .dow{color:var(--danger);}

  td.job-cell{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    vertical-align:top;
    padding:5px;
    min-width:150px;
    max-width:150px;
    transition:background .1s;
  }
  tr:nth-child(even) td.job-cell{background:rgba(0,0,0,.012);}
  td.job-cell.dragover{background:var(--gold-light)!important;outline:2px dashed var(--gold);outline-offset:-2px;}
  tr.row-weekend td.job-cell{background:var(--weekend)!important;}

  .add-job-btn{
    width:100%;
    border:1.5px dashed #c3bda4;
    background:transparent;
    color:#948d70;
    border-radius:5px;
    font-size:15px;
    line-height:1;
    padding:4px 0;
    cursor:pointer;
    margin-top:2px;
  }
  .add-job-btn:hover{border-color:var(--green);color:var(--green);background:#fff;}

  .job-card{
    background:var(--card-normal);
    border:1px solid #d9d3bf;
    border-left:4px solid var(--green);
    border-radius:5px;
    padding:6px 7px;
    margin-bottom:4px;
    font-size:10px;
    line-height:1.35;
    cursor:grab;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .job-card:active{cursor:grabbing;}
  .job-card.dragging{opacity:.35;}
  .job-card.type-spare{border-left-color:#7a8f86;background:var(--card-spare);}
  .job-card.type-vacation{border-left-color:var(--danger);background:var(--card-vacation);}
  .job-card.type-note{border-left-color:var(--gold);background:var(--card-note);}
  .job-card.type-pm{border-left-color:#2a6f97;background:#e9f2f8;}
  .job-card.type-safety_inspection{border-left-color:#b5541a;background:#fbede0;}
  .job-card .maint-banner{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;
    margin-bottom:3px;
  }
  .job-card.type-pm .maint-banner{color:#2a6f97;}
  .job-card.type-safety_inspection .maint-banner{color:#b5541a;}
  .job-card .maint-detail{font-size:9.5px;color:#5c574a;margin-bottom:2px;}
  .job-card .route{font-weight:700;color:var(--green-dark);font-size:10.5px;white-space:normal;word-break:break-word;}
  .job-card .route .arrow{color:var(--gold);margin:0 2px;}
  .job-card .meta{color:#5c574a;font-size:9px;margin-top:2px;white-space:normal;word-break:break-word;}
  .job-card .horse{font-style:italic;color:#3a3630;font-size:9px;margin-top:1px;white-space:normal;}
  .job-card .notes{color:#7a5c2e;font-size:9px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .job-card .lb-ref{
    display:inline-block;margin-top:3px;
    font-size:9px;font-weight:700;color:var(--green-dark);
    background:var(--gold-light);border-radius:4px;padding:2px 5px;
    text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }
  .job-card .lb-ref:hover{background:var(--gold);}

  .toast{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    background:var(--danger);color:#fff;
    padding:12px 20px;border-radius:8px;
    font-size:13.5px;font-weight:600;line-height:1.4;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
    z-index:300;max-width:520px;text-align:center;
    display:flex;align-items:center;gap:10px;
  }
  .toast .toast-close{cursor:pointer;font-weight:900;font-size:16px;line-height:1;color:rgba(255,255,255,.8);flex-shrink:0;}
  .toast .toast-close:hover{color:#fff;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(14,20,17,.55);
    display:none;align-items:center;justify-content:center;z-index:200;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:#fff;border-radius:10px;width:380px;max-width:92vw;
    padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.35);
    max-height:90vh;overflow-y:auto;
  }
  .modal h2{margin:0 0 14px;font-size:16px;color:var(--green-dark);}
  .modal label{display:block;font-size:11px;font-weight:700;color:#6b6555;text-transform:uppercase;letter-spacing:.4px;margin:10px 0 3px;}
  .modal input, .modal select, .modal textarea{
    width:100%;padding:7px 8px;border:1px solid #cfc9b8;border-radius:5px;font-size:13px;font-family:inherit;
  }
  .modal textarea{resize:vertical;min-height:44px;}
  .modal-row{display:flex;gap:8px;}
  .modal-row > div{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px;}
  .modal-actions .left{display:flex;gap:8px;}
  .btn-primary{background:var(--green-dark);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;}
  .btn-primary:hover{background:var(--green);}
  .btn-secondary{background:#ece7d8;color:var(--ink);border:none;padding:9px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px;}
  .btn-secondary:hover{background:#ddd6c0;}
  .btn-delete{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:9px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px;}
  .btn-delete:hover{background:var(--danger);color:#fff;}
</style>
</head>
<body>

<div class="topbar">
  <h1>SALLEE <span>DISPATCH</span> BOARD</h1>
  <div class="nav-group">
    <button class="btn ghost" id="prevBtn">&larr; Prev 2 Wks</button>
    <div class="range-label" id="rangeLabel"></div>
    <button class="btn ghost" id="nextBtn">Next 2 Wks &rarr;</button>
    <button class="btn ghost" id="todayBtn">This Week</button>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="exportBtn">Export JSON</button>
  <button class="btn" id="importBtn">Import JSON</button>
  <input type="file" id="importFile" accept=".json" style="display:none;">
  <span class="status-note" id="statusNote">Saved locally in this browser</span>
</div>

<div id="topScrollSync"><div id="topScrollSyncInner"></div></div>

<div class="board-wrap">
  <table class="board" id="boardTable">
    <thead>
      <tr id="regionRow"></tr>
      <tr id="headRow"></tr>
    </thead>
    <tbody id="boardBody"></tbody>
  </table>
</div>

<div class="modal-overlay" id="jobModalOverlay">
  <div class="modal">
    <h2 id="jobModalTitle">Add Job</h2>
    <label>Type</label>
    <select id="jobType">
      <option value="normal">Normal job</option>
      <option value="spare">Spare / standby</option>
      <option value="vacation">Vacation / off</option>
      <option value="note">Note only</option>
      <option value="pm">PM</option>
      <option value="safety_inspection">Safety Inspection</option>
    </select>
    <div id="technicianRow" class="modal-row" style="display:none;">
      <div>
        <label>Maintenance Time</label>
        <input id="jobMaintTime" type="time">
      </div>
      <div>
        <label>Assigned Technician</label>
        <input id="jobTechnician" placeholder="e.g. John Reyes">
      </div>
    </div>
    <label>Assign Driver</label>
    <select id="jobAssignDriver"></select>
    <div class="modal-row">
      <div>
        <label>Origin</label>
        <input id="jobOrigin" placeholder="e.g. KY or track name">
      </div>
      <div>
        <label>Origin Trainer/Farm</label>
        <input id="jobOriginFarm" placeholder="e.g. Rusty Arnold">
      </div>
    </div>
    <div class="modal-row">
      <div>
        <label>Destination</label>
        <input id="jobDestination" placeholder="e.g. BEL or track name">
      </div>
      <div>
        <label>Destination Trainer/Farm</label>
        <input id="jobDestinationFarm" placeholder="e.g. High Point Farm">
      </div>
    </div>
    <div class="modal-row">
      <div>
        <label>Leave Yard Time</label>
        <input id="jobLeaveYardTime" type="time">
      </div>
      <div>
        <label>Load Time</label>
        <input id="jobTime" type="time">
      </div>
    </div>
    <label>Load Type</label>
    <select id="jobLoadType">
      <option value="">—</option>
      <option value="stable_move">Stable Move</option>
      <option value="special">Special</option>
      <option value="mix_load">Mix Load</option>
      <option value="shuttle">Shuttle</option>
      <option value="race_and_return">Race and Return</option>
    </select>
    <div id="repeatThroughRow" class="modal-row">
      <div>
        <label>Start Date</label>
        <input type="date" id="jobStartDate">
      </div>
      <div>
        <label>End Date (optional &mdash; for a vacation stretch, etc.)</label>
        <input type="date" id="jobEndDate">
      </div>
    </div>
    <label>Load Board Link / Order # (optional)</label>
    <div style="display:flex;gap:6px;">
      <input id="jobLoadBoardRef" placeholder="Paste a link/order #, or browse ->" style="flex:1;">
      <button type="button" class="btn-secondary" id="lbBrowseBtn" style="white-space:nowrap;">Browse</button>
    </div>
    <div id="lbBrowsePanel" style="display:none;border:1px solid #cfc9b8;border-radius:6px;margin-top:6px;max-height:160px;overflow-y:auto;"></div>
    <label>Notes</label>
    <textarea id="jobNotes" placeholder="Special instructions..."></textarea>
    <div class="modal-actions">
      <div class="left">
        <button class="btn-delete" id="jobDeleteBtn" style="display:none;">Delete</button>
      </div>
      <div class="left">
        <button class="btn-secondary" id="jobCancelBtn">Cancel</button>
        <button class="btn-primary" id="jobSaveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="driverModalOverlay">
  <div class="modal">
    <h2 id="driverModalTitle">Add Driver / Team</h2>
    <div class="modal-row">
      <div>
        <label>Driver 1</label>
        <input id="drvName1" placeholder="e.g. PAUL Z.">
      </div>
      <div>
        <label>Driver 2 (optional)</label>
        <input id="drvName2" placeholder="e.g. JASEN">
      </div>
    </div>
    <div class="modal-row">
      <div>
        <label>Truck #</label>
        <input id="drvTruck" placeholder="e.g. 657">
      </div>
      <div>
        <label>Trailer #</label>
        <input id="drvTrailer" placeholder="e.g. 185A+">
      </div>
    </div>
    <label>Location</label>
    <select id="drvLocation">
      <option value="">— Unassigned —</option>
      <option value="KY">KY</option>
      <option value="FL">FL</option>
      <option value="NY">NY</option>
    </select>
    <div class="modal-actions">
      <div class="left">
        <button class="btn-delete" id="drvDeleteBtn" style="display:none;">Remove</button>
      </div>
      <div class="left">
        <button class="btn-secondary" id="drvCancelBtn">Cancel</button>
        <button class="btn-primary" id="drvSaveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <h2>Please confirm</h2>
    <p id="confirmMessage" style="font-size:13px;color:#3a362c;line-height:1.5;margin:0 0 4px;"></p>
    <div class="modal-actions">
      <div class="left"></div>
      <div class="left">
        <button class="btn-secondary" id="confirmCancelBtn">Cancel</button>
        <button class="btn-delete" id="confirmOkBtn">Remove</button>
      </div>
    </div>
  </div>
</div>

<script>
const DEFAULT_DRIVERS = [
  {id:'d1', name1:'PAUL Z.', name2:'JASEN', truck:'657', trailer:'185A+', location:'KY'},
  {id:'d2', name1:'DREW', name2:'BRADLEY S.', truck:'645', trailer:'207A+', location:'KY'},
  {id:'d3', name1:'ALLEN', name2:'MATHEW C.', truck:'654', trailer:'209A++', location:'KY'},
  {id:'d4', name1:'CHUY', name2:'', truck:'648', trailer:'198A+', location:'KY'},
  {id:'d5', name1:'BRADLEY H.', name2:'', truck:'643', trailer:'203A+', location:'KY'},
  {id:'d6', name1:'MATHEW F.', name2:'', truck:'638', trailer:'169A+', location:'KY'},
  {id:'d7', name1:'ZIPPO', name2:'WILLIAM', truck:'656', trailer:'201A++', location:'KY'},
  {id:'d8', name1:'CLIFFORD', name2:'', truck:'649', trailer:'208A+', location:'KY'},
  {id:'d9', name1:'DERRICK', name2:'LANCE', truck:'651', trailer:'182A+', location:'KY'},
  {id:'d10', name1:'JERALD', name2:'LEVY', truck:'658', trailer:'211A+', location:'KY'},
  {id:'d11', name1:'WALTER', name2:'JOHNNY D.', truck:'660', trailer:'205A++', location:'KY'},
  {id:'d12', name1:'BILL', name2:'DAVE', truck:'661', trailer:'210A+', location:'KY'},
  {id:'d13', name1:'CHARLES', name2:'NOBERTO', truck:'659', trailer:'184A+', location:'KY'},
  {id:'d14', name1:'CHRIS D.', name2:'ZACH', truck:'647', trailer:'206A+', location:'KY'},
  {id:'d15', name1:'DAVID H.', name2:'MIKE B.', truck:'646', trailer:'200A+', location:'KY'},
  {id:'d16', name1:"DAI'SHAWN", name2:'JERROD', truck:'644', trailer:'183A+', location:'KY'},
  {id:'d17', name1:'MIGUEL', name2:'', truck:'653', trailer:'212A+', location:'FL'},
  {id:'d18', name1:'SEBASTIAN M.', name2:'', truck:'632', trailer:'1042A+', location:'FL'},
  {id:'d19', name1:'JUAN C.', name2:'', truck:'639', trailer:'1018A+', location:'FL'},
  {id:'d20', name1:'KEITH D.', name2:'', truck:'635', trailer:'1098A+', location:'FL'},
  {id:'d21', name1:'JOE MURPHY', name2:'', truck:'636', trailer:'190A+', location:'FL'},
  {id:'d22', name1:'DONNIE M', name2:'', truck:'640', trailer:'191A++', location:'FL'},
  {id:'d23', name1:'STEVE MC.', name2:'', truck:'634', trailer:'199A+', location:'FL'},
  {id:'d24', name1:'NEMO', name2:'', truck:'633', trailer:'168A+', location:'NY'},
  {id:'d25', name1:'THEMILDA', name2:'', truck:'511', trailer:'', location:'NY'},
  {id:'d26', name1:'BERNIE', name2:'', truck:'641', trailer:'196A+', location:'NY'}
];

const DAY_NAMES=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const LOAD_TYPE_LABELS={stable_move:'Stable Move', special:'Special', mix_load:'Mix Load', shuttle:'Shuttle', race_and_return:'Race and Return'};
const MAINTENANCE_LABELS={pm:'PM', safety_inspection:'Safety Inspection'};
const REGION_ORDER = ['KY','FL','NY',''];
const REGION_DISPLAY = {KY:'KY', FL:'FL', NY:'NY', '':'Unassigned'};

const LS_DRIVERS='sallee_dispatch_drivers_v2';
const LS_JOBS='sallee_dispatch_jobs_v2';
const LS_WEEKSTART='sallee_dispatch_weekstart_v2';

let drivers = JSON.parse(localStorage.getItem(LS_DRIVERS) || 'null') || DEFAULT_DRIVERS;
let jobs = JSON.parse(localStorage.getItem(LS_JOBS) || 'null') || [];
let jobIdCounter = jobs.reduce((m,j)=>Math.max(m, parseInt((j.id||'j0').replace('j',''))||0), 0) + 1;

function mondayOf(d){
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day===0?-6:1)-day;
  dt.setDate(dt.getDate()+diff);
  dt.setHours(0,0,0,0);
  return dt;
}
let weekStart = new Date(localStorage.getItem(LS_WEEKSTART) || mondayOf(new Date()).toISOString());
weekStart = mondayOf(weekStart);

function saveAll(){
  localStorage.setItem(LS_DRIVERS, JSON.stringify(drivers));
  localStorage.setItem(LS_JOBS, JSON.stringify(jobs));
  localStorage.setItem(LS_WEEKSTART, weekStart.toISOString());
  document.getElementById('statusNote').textContent = 'Saved ' + new Date().toLocaleTimeString();
}

function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getDateRange(){
  const arr=[];
  for(let i=0;i<14;i++){
    const d = new Date(weekStart);
    d.setDate(d.getDate()+i);
    arr.push(d);
  }
  return arr;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function dateFromStr(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function driverLabel(drv){
  if(!drv) return '';
  const names = [drv.name1, drv.name2].filter(Boolean).join(' / ');
  const truckPart = [drv.truck, drv.trailer].filter(Boolean).join('/');
  return names + (truckPart ? ' · '+truckPart : '');
}
function formatTimeDisplay(t){
  if(!t) return '';
  const parts = t.split(':');
  let h = parseInt(parts[0], 10);
  const m = parts[1] || '00';
  if(isNaN(h)) return t;
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if(h === 0) h = 12;
  return `${h}:${m} ${ampm}`;
}
function findTimeConflict(driverId, date, time, excludeIds){
  if(!driverId || !time) return null;
  return jobs.find(j => j.assignedDriverId===driverId && j.date===date && j.time===time && !excludeIds.includes(j.id)) || null;
}

function getSortedDrivers(){
  const sorted = [];
  REGION_ORDER.forEach(region=>{
    drivers.forEach(d=>{
      if((d.location||'')===region) sorted.push(d);
    });
  });
  return sorted;
}
function getRegionGroups(sortedDrivers){
  const groups = [];
  sortedDrivers.forEach(d=>{
    const region = d.location || '';
    const last = groups[groups.length-1];
    if(last && last.region===region){ last.count++; }
    else{ groups.push({region, count:1}); }
  });
  return groups;
}

function render(){
  const sortedDrivers = getSortedDrivers();
  renderRegionRow(sortedDrivers);
  renderHeadRow(sortedDrivers);
  renderBoard(sortedDrivers);
  renderRangeLabel();
  syncScrollWidth();
}

function syncScrollWidth(){
  const table = document.getElementById('boardTable');
  document.getElementById('topScrollSyncInner').style.width = table.scrollWidth + 'px';
}

let syncingScroll = false;
(function setupScrollSync(){
  const boardWrap = document.querySelector('.board-wrap');
  const topSync = document.getElementById('topScrollSync');
  topSync.addEventListener('scroll', ()=>{
    if(syncingScroll) return;
    syncingScroll = true;
    boardWrap.scrollLeft = topSync.scrollLeft;
    syncingScroll = false;
  });
  boardWrap.addEventListener('scroll', ()=>{
    if(syncingScroll) return;
    syncingScroll = true;
    topSync.scrollLeft = boardWrap.scrollLeft;
    syncingScroll = false;
  });
})();

function renderRangeLabel(){
  const dates = getDateRange();
  const opts = {month:'short', day:'numeric'};
  document.getElementById('rangeLabel').textContent =
    `${dates[0].toLocaleDateString('en-US',opts)} – ${dates[13].toLocaleDateString('en-US',opts)}, ${dates[13].getFullYear()}`;
}

function renderRegionRow(sortedDrivers){
  const row = document.getElementById('regionRow');
  row.innerHTML = '';
  const spacer = document.createElement('th');
  spacer.className = 'region-spacer';
  row.appendChild(spacer);

  const groups = getRegionGroups(sortedDrivers);
  groups.forEach(g=>{
    const th = document.createElement('th');
    th.className = 'region-label region-' + (g.region || 'unassigned');
    th.colSpan = g.count;
    th.textContent = REGION_DISPLAY[g.region] || 'Unassigned';
    row.appendChild(th);
  });

  const endSpacer = document.createElement('th');
  endSpacer.className = 'region-end-spacer';
  row.appendChild(endSpacer);
}

function renderHeadRow(sortedDrivers){
  const row = document.getElementById('headRow');
  row.innerHTML = '';
  const corner = document.createElement('td');
  corner.className = 'corner-cell';
  row.appendChild(corner);

  sortedDrivers.forEach(drv=>{
    const th = document.createElement('th');
    th.className = 'driver-head';
    th.dataset.driverId = drv.id;
    th.innerHTML = `
      <div class="dname">${escapeHtml(drv.name1||'—')}</div>
      ${drv.name2 ? `<div class="dname2">${escapeHtml(drv.name2)}</div>` : ''}
      <div class="dtruck">${escapeHtml([drv.truck,drv.trailer].filter(Boolean).join('/'))}</div>
    `;
    th.addEventListener('click', ()=>openDriverModal(drv.id));
    row.appendChild(th);
  });

  const addTh = document.createElement('th');
  addTh.className = 'add-driver-cell';
  addTh.innerHTML = `<button title="Add driver/team">+</button>`;
  addTh.querySelector('button').addEventListener('click', ()=>openDriverModal(null));
  row.appendChild(addTh);
}

function renderBoard(sortedDrivers){
  const body = document.getElementById('boardBody');
  body.innerHTML = '';
  const dates = getDateRange();

  dates.forEach(d=>{
    const dateStr = fmtDate(d);
    const dow = d.getDay();
    const isWeekend = dow===0 || dow===6;
    const tr = document.createElement('tr');
    if(isWeekend) tr.className = 'row-weekend';

    const dateTd = document.createElement('td');
    dateTd.className = 'date-cell' + (isWeekend?' weekend':'');
    dateTd.innerHTML = `<div class="dow">${DAY_NAMES[dow]}</div><div class="dnum">${d.getMonth()+1}/${d.getDate()}</div>`;
    tr.appendChild(dateTd);

    sortedDrivers.forEach(drv=>{
      const td = document.createElement('td');
      td.className = 'job-cell';
      td.dataset.date = dateStr;
      td.dataset.driverId = drv.id;

      const cellJobs = jobs.filter(j=>j.date===dateStr && j.assignedDriverId===drv.id)
                            .sort((a,b)=>(a.order||0)-(b.order||0));
      cellJobs.forEach(job=>td.appendChild(buildJobCard(job)));

      const addBtn = document.createElement('button');
      addBtn.className = 'add-job-btn';
      addBtn.textContent = '+';
      addBtn.title = 'Add job for this driver/date';
      addBtn.addEventListener('click', ()=>openJobModal(null, dateStr, drv.id));
      td.appendChild(addBtn);

      attachDropZone(td);
      tr.appendChild(td);
    });

    body.appendChild(tr);
  });
}

function buildJobCard(job){
  const card = document.createElement('div');
  card.className = 'job-card type-' + (job.type||'normal');
  card.draggable = true;
  card.dataset.jobId = job.id;

  let routeHtml = '';
  if(job.origin || job.destination){
    routeHtml = `<div class="route">${escapeHtml(job.origin||'?')}<span class="arrow">&rarr;</span>${escapeHtml(job.destination||'?')}</div>`;
  }
  let metaBits = [];
  if(job.leaveYardTime) metaBits.push('Leave ' + formatTimeDisplay(job.leaveYardTime));
  if(job.time) metaBits.push('Load ' + formatTimeDisplay(job.time));
  const farmBits = [job.originFarm, job.destinationFarm].filter(Boolean).join(' → ');
  if(farmBits) metaBits.push(farmBits);
  const metaHtml = metaBits.length ? `<div class="meta">${escapeHtml(metaBits.join(' · '))}</div>` : '';
  const horseHtml = job.loadType ? `<div class="horse">${escapeHtml(LOAD_TYPE_LABELS[job.loadType]||job.loadType)}</div>` : '';
  const notesHtml = job.notes ? `<div class="notes" title="${escapeHtml(job.notes)}">${escapeHtml(job.notes)}</div>` : '';

  let lbRefHtml = '';
  if(job.loadBoardRef){
    const isUrl = /^https?:\/\//i.test(job.loadBoardRef.trim());
    if(isUrl){
      lbRefHtml = `<a class="lb-ref" href="${escapeHtml(job.loadBoardRef.trim())}" target="_blank" rel="noopener" title="Open in Load Board">&#128279; Load Board</a>`;
    } else {
      lbRefHtml = `<span class="lb-ref" title="Load Board reference">&#128279; ${escapeHtml(job.loadBoardRef)}</span>`;
    }
  }

  let body = '';
  if(job.type === 'pm' || job.type === 'safety_inspection'){
    const label = MAINTENANCE_LABELS[job.type] || job.type;
    const bits = [];
    if(job.maintTime) bits.push(formatTimeDisplay(job.maintTime));
    if(job.technician) bits.push('Tech: ' + job.technician);
    body += `<div class="maint-banner">${escapeHtml(label)}</div>`;
    if(bits.length) body += `<div class="maint-detail">${escapeHtml(bits.join(' · '))}</div>`;
  }
  body += routeHtml + metaHtml + horseHtml + notesHtml + lbRefHtml;
  if(!body){ body = `<div class="meta">(click to edit)</div>`; }
  card.innerHTML = body;

  card.addEventListener('click', (e)=>{
    if(e.target.closest('.lb-ref')) return;
    openJobModal(job.id);
  });
  card.addEventListener('dragstart', (e)=>{
    e.dataTransfer.setData('application/x-job', job.id);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(()=>card.classList.add('dragging'), 0);
  });
  card.addEventListener('dragend', ()=>card.classList.remove('dragging'));

  return card;
}

function attachDropZone(td){
  td.addEventListener('dragover', (e)=>{
    if(e.dataTransfer.types.includes('application/x-job')){
      e.preventDefault();
      td.classList.add('dragover');
    }
  });
  td.addEventListener('dragleave', ()=>td.classList.remove('dragover'));
  td.addEventListener('drop', (e)=>{
    td.classList.remove('dragover');
    const jobId = e.dataTransfer.getData('application/x-job');
    if(!jobId) return;
    e.preventDefault();
    const job = jobs.find(j=>j.id===jobId);
    if(!job) return;

    const targetDate = td.dataset.date;
    const targetDriverId = td.dataset.driverId;

    const conflict = findTimeConflict(targetDriverId, targetDate, job.time, [job.id]);
    if(conflict){
      const drv = drivers.find(d=>d.id===targetDriverId);
      showToast(`${drv ? driverLabel(drv) : 'This driver/team'} is already assigned to a trip at ${formatTimeDisplay(job.time)} on this date (${conflict.origin||'?'} \u2192 ${conflict.destination||'?'}). Pick a different time or driver.`);
      return;
    }

    job.date = targetDate;
    job.assignedDriverId = targetDriverId;
    const siblingMax = jobs.filter(j=>j.date===targetDate && j.assignedDriverId===targetDriverId && j.id!==job.id)
                            .reduce((m,j)=>Math.max(m, j.order||0), 0);
    job.order = siblingMax + 1;
    saveAll();
    render();
  });
}

function showToast(message){
  const existing = document.getElementById('appToast');
  if(existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'appToast';
  el.className = 'toast';
  el.innerHTML = `<span>${escapeHtml(message)}</span><span class="toast-close">&times;</span>`;
  el.querySelector('.toast-close').addEventListener('click', ()=>el.remove());
  document.body.appendChild(el);
  setTimeout(()=>{ if(document.getElementById('appToast')===el) el.remove(); }, 6000);
}

const LOAD_BOARD_ORDERS_URL = 'https://canumanu.github.io/SALLEE-LOAD-BOARD/data/orders.json';
let loadBoardOrdersCache = null;
async function fetchLoadBoardOrders(){
  if(loadBoardOrdersCache) return loadBoardOrdersCache;
  const res = await fetch(LOAD_BOARD_ORDERS_URL, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  loadBoardOrdersCache = Array.isArray(data) ? data : (data.orders || data.Orders || []);
  return loadBoardOrdersCache;
}
function pickField(obj, candidates){
  for(const key of candidates){
    if(obj[key] !== undefined && obj[key] !== null && obj[key] !== '') return obj[key];
  }
  return '';
}
function describeOrder(order){
  const origin = pickField(order, ['origin','Origin','ORIGIN']);
  const destination = pickField(order, ['destination','Destination','DESTINATION']);
  const date = pickField(order, ['date','Date','tripDate','TripDate','pickupDate','PickupDate']);
  const id = pickField(order, ['id','Id','ID','orderId','OrderID','orderNumber']);
  let horses = pickField(order, ['horses','Horses']);
  let horseLabel = '';
  if(Array.isArray(horses)) horseLabel = horses.map(h=>(h && (h.name||h.Name))||'').filter(Boolean).join(', ');
  else if(typeof horses === 'string') horseLabel = horses;
  if(!horseLabel) horseLabel = pickField(order, ['HORSE NAME(S)','horseNames','HorseNames']);
  const label = `${origin||'?'} \u2192 ${destination||'?'}${date? ' · '+date:''}${horseLabel? ' · '+horseLabel:''}`;
  return {id, date, origin, destination, horseLabel, label};
}

    document.getElementById('jobLeaveYardTime').value = job.leaveYardTime||'';

    document.getElementById('jobDestination').value='';
    document.getElementById('jobDestinationFarm').value='';
    document.getElementById('jobLeaveYardTime').value='';
    document.getElementById('jobTime').value='';
    document.getElementById('jobLoadType').value='';
    document.getElementById('jobLoadBoardRef').value='';
    document.getElementById('jobNotes').value='';

    pendingDate = date;
    pendingDriverId = driverId;
    document.getElementById('repeatThroughRow').style.display = '';

    document.getElementById('jobEndDate').value = '';

  }
  document.getElementById('lbBrowsePanel').style.display='none';
  document.getElementById('lbBrowsePanel').innerHTML='';
  overlay.classList.add('open');
}

}

document.getElementById('lbBrowseBtn').addEventListener('click', async ()=>{
  const panel = document.getElementById('lbBrowsePanel');
  panel.style.display = 'block';
  panel.innerHTML = '<div style="padding:8px;font-size:12px;color:#8a8368;">Loading from Load Board…</div>';
  try{
    const orders = await fetchLoadBoardOrders();
    const jobDateVal = editingJobId
      ? ((jobs.find(j=>j.id===editingJobId)||{}).date)
      : (document.getElementById('jobStartDate').value || pendingDate);
    const described = orders.map(describeOrder);
    const filtered = jobDateVal ? described.filter(o=>o.date===jobDateVal) : described;
    const toShow = filtered.length ? filtered : described;
    if(!toShow.length){
      panel.innerHTML = '<div style="padding:8px;font-size:12px;color:#8a8368;">No orders found in the Load Board data.</div>';
      return;
    }
    panel.innerHTML = '';
    if(!filtered.length){
      const note = document.createElement('div');
      note.style.cssText='padding:6px 10px;font-size:11px;color:#a49c80;';
      note.textContent = `No exact match for ${jobDateVal||'this date'} — showing everything:`;
      panel.appendChild(note);
    }
    toShow.slice(0,50).forEach(o=>{
      const row = document.createElement('div');
      row.style.cssText='padding:7px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid #eee6d0;';
      row.textContent = o.label;
      row.addEventListener('mouseenter', ()=>row.style.background='#f7f1de');
      row.addEventListener('mouseleave', ()=>row.style.background='');
      row.addEventListener('click', ()=>{
        document.getElementById('jobLoadBoardRef').value = o.id ? `Order ${o.id}: ${o.label}` : o.label;
        panel.style.display='none';
        panel.innerHTML='';
      });
      panel.appendChild(row);
    });
  }catch(err){
    panel.innerHTML = `<div style="padding:8px;font-size:12px;color:var(--danger);">Could not reach the Load Board data (${err.message}). You can still paste a link or order # manually above.</div>`;
  }
});

document.getElementById('jobSaveBtn').addEventListener('click', ()=>{
  const data = {
    type: document.getElementById('jobType').value,
    maintTime: document.getElementById('jobMaintTime').value,
    technician: document.getElementById('jobTechnician').value.trim(),
    origin: document.getElementById('jobOrigin').value.trim(),
    originFarm: document.getElementById('jobOriginFarm').value.trim(),
    destination: document.getElementById('jobDestination').value.trim(),
    destinationFarm: document.getElementById('jobDestinationFarm').value.trim(),
    leaveYardTime: document.getElementById('jobLeaveYardTime').value,
    time: document.getElementById('jobTime').value,
    loadType: document.getElementById('jobLoadType').value,
    loadBoardRef: document.getElementById('jobLoadBoardRef').value.trim(),
    notes: document.getElementById('jobNotes').value.trim(),
  };
  const selectedDriverId = document.getElementById('jobAssignDriver').value || null;

  if(editingJobId){
    const job = jobs.find(j=>j.id===editingJobId);
    if(selectedDriverId){
      const conflict = findTimeConflict(selectedDriverId, job.date, data.time, [job.id]);
      if(conflict){
        const drv = drivers.find(d=>d.id===selectedDriverId);
        showToast(`${drv ? driverLabel(drv) : 'This driver/team'} is already assigned to a trip at ${formatTimeDisplay(data.time)} on ${job.date} (${conflict.origin||'?'} \u2192 ${conflict.destination||'?'}). Pick a different time or driver.`);
        return;
      }
    }
    Object.assign(job, data);
    job.assignedDriverId = selectedDriverId;
  } else {
    const startDate = document.getElementById('jobStartDate').value || pendingDate;
    const endDate = document.getElementById('jobEndDate').value;
    const datesToCreate = [];
    if(endDate && endDate > startDate){
      let cursor = dateFromStr(startDate);
      const endD = dateFromStr(endDate);
      let guard = 0;
      while(cursor <= endD && guard < 60){
        datesToCreate.push(fmtDate(cursor));
        cursor.setDate(cursor.getDate()+1);
        guard++;
      }
    } else {
      datesToCreate.push(startDate);
    }

    if(selectedDriverId){
      for(const dStr of datesToCreate){
        const conflict = findTimeConflict(selectedDriverId, dStr, data.time, []);
        if(conflict){
          const drv = drivers.find(d=>d.id===selectedDriverId);
          showToast(`${drv ? driverLabel(drv) : 'This driver/team'} is already assigned to a trip at ${formatTimeDisplay(data.time)} on ${dStr} (${conflict.origin||'?'} \u2192 ${conflict.destination||'?'}). Nothing was created \u2014 pick a different time or driver.`);
          return;
        }
      }
    }

    datesToCreate.forEach(dStr=>{
      const maxOrder = jobs.filter(j=>j.date===dStr && j.assignedDriverId===selectedDriverId).reduce((m,j)=>Math.max(m,j.order||0),0);
      jobs.push({id:'j'+(jobIdCounter++), date:dStr, assignedDriverId:selectedDriverId, order:maxOrder+1, ...data});
    });
  }
  saveAll();
  closeJobModal();
  render();
});

document.getElementById('jobDeleteBtn').addEventListener('click', ()=>{
  jobs = jobs.filter(j=>j.id!==editingJobId);
  saveAll();
  closeJobModal();
  render();
});

document.getElementById('drvDeleteBtn').addEventListener('click', ()=>{
  showConfirm('Remove this driver/team? Any jobs currently assigned to them will become unassigned.', ()=>{
    jobs.forEach(j=>{ if(j.assignedDriverId===editingDriverId) j.assignedDriverId=null; });
    drivers = drivers.filter(d=>d.id!==editingDriverId);
    saveAll();
    closeDriverModal();
    render();
  });
});

document.getElementById('prevBtn').addEventListener('click', ()=>{ weekStart.setDate(weekStart.getDate()-14); saveAll(); render(); });
document.getElementById('nextBtn').addEventListener('click', ()=>{ weekStart.setDate(weekStart.getDate()+14); saveAll(); render(); });
document.getElementById('todayBtn').addEventListener('click', ()=>{ weekStart = mondayOf(new Date()); saveAll(); render(); });

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const data = {drivers, jobs, weekStart: weekStart.toISOString()};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sallee-dispatch-board-' + fmtDate(new Date()) + '.json';
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const data = JSON.parse(evt.target.result);
      if(data.drivers) drivers = data.drivers;
      if(data.jobs) jobs = data.jobs;
      if(data.weekStart) weekStart = mondayOf(new Date(data.weekStart));
      saveAll();
      render();
    }catch(err){ showToast('Could not read that file: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value='';
});

render();
</script>
</body>
</html>
