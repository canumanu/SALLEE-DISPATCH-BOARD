<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sallee Dispatch Board</title>
<style>
  :root{
    --green-dark:#0e3b2e;
    --green:#14523f;
    --green-light:#1e6b52;
    --gold:#c8a24a;
    --gold-light:#e8d9a8;
    --cream:#f7f4ec;
    --ink:#1c2420;
    --line:#d8d2c0;
    --weekend:#f0e8d0;
    --card-normal:#ffffff;
    --card-spare:#eef3f0;
    --card-vacation:#f5e0d8;
    --card-note:#fff8e0;
    --danger:#a23b2e;
    --ky:#0e3b2e;
    --fl:#8a5a00;
    --ny:#1b3a6b;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);}

  .topbar{
    background:var(--green-dark);
    color:var(--gold-light);
    padding:10px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:60;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
  }
  .topbar h1{
    font-size:18px;
    letter-spacing:1.5px;
    margin:0;
    color:#fff;
    font-weight:700;
    text-transform:uppercase;
  }
  .topbar h1 span{color:var(--gold);}
  .nav-group{display:flex;align-items:center;gap:6px;margin-left:8px;}
  .range-label{font-size:13px;font-weight:600;color:var(--gold-light);min-width:190px;text-align:center;}
  .btn{
    background:var(--green-light);
    border:1px solid rgba(255,255,255,.15);
    color:#fff;
    padding:7px 12px;
    border-radius:6px;
    font-size:12.5px;
    cursor:pointer;
    font-weight:600;
    white-space:nowrap;
  }
  .btn:hover{background:var(--gold);color:var(--green-dark);}
  .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.3);}
  .btn.ghost:hover{background:rgba(255,255,255,.1);color:#fff;}
  .spacer{flex:1;}
  .status-note{font-size:11px;color:rgba(255,255,255,.55);}

  #topScrollSync{
    overflow-x:auto;
    overflow-y:hidden;
    height:16px;
    background:var(--green-dark);
    border-bottom:2px solid var(--gold);
    position:sticky;
    top:54px;
    z-index:59;
  }
  #topScrollSync::-webkit-scrollbar{height:14px;}
  #topScrollSync::-webkit-scrollbar-track{background:var(--green-dark);}
  #topScrollSync::-webkit-scrollbar-thumb{background:var(--gold);border-radius:7px;border:3px solid var(--green-dark);}
  #topScrollSyncInner{height:1px;}

  .board-wrap{
    overflow:auto;
    height:calc(100vh - 54px);
    position:relative;
  }
  table.board{
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
  }

  .region-spacer{
    position:sticky;top:0;left:0;z-index:35;
    background:var(--green-dark);
    width:84px;min-width:84px;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  th.region-label{
    position:sticky;top:0;z-index:25;
    color:#fff;
    font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    text-align:center;
    padding:5px 0;
    border-bottom:1px solid rgba(255,255,255,.12);
    border-right:2px solid var(--gold);
  }
  th.region-label.region-KY{background:var(--ky);}
  th.region-label.region-FL{background:var(--fl);}
  th.region-label.region-NY{background:var(--ny);}
  th.region-label.region-unassigned{background:#5c5648;}
  .region-end-spacer{
    position:sticky;top:0;z-index:25;
    background:var(--green-dark);
    width:46px;min-width:46px;
    border-bottom:1px solid rgba(255,255,255,.12);
  }

  td.corner-cell{
    position:sticky;top:29px;left:0;z-index:35;
    background:var(--green-dark);
    width:84px;min-width:84px;
    border-bottom:2px solid var(--gold);
    border-right:2px solid var(--gold);
    height:0;
    padding:0;
  }
  th.driver-head{
    position:sticky;top:29px;z-index:20;
    background:var(--green-dark);
    color:#fff;
    width:150px;min-width:150px;
    padding:7px 6px;
    border-bottom:2px solid var(--gold);
    border-right:1px solid rgba(255,255,255,.12);
    text-align:center;
    vertical-align:top;
    cursor:pointer;
    user-select:none;
  }
  th.driver-head:hover{background:var(--green);}
  th.driver-head .dname{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  th.driver-head .dname2{font-size:10.5px;color:var(--gold-light);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  th.driver-head .dtruck{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px;font-family:ui-monospace,Consolas,monospace;}
  .add-driver-cell{
    position:sticky;top:29px;z-index:20;
    background:var(--green-dark);
    width:46px;min-width:46px;
    border-bottom:2px solid var(--gold);
    text-align:center;
    vertical-align:middle;
  }
  .add-driver-cell button{
    background:transparent;border:1.5px dashed var(--gold);color:var(--gold);
    border-radius:6px;width:30px;height:30px;font-size:17px;cursor:pointer;
  }
  .add-driver-cell button:hover{background:var(--gold);color:var(--green-dark);}

  td.date-cell{
    position:sticky;left:0;z-index:15;
    background:var(--cream);
    border-right:2px solid var(--gold);
    border-bottom:1px solid var(--line);
    padding:6px 6px;
    vertical-align:top;
    width:84px;min-width:84px;
  }
  td.date-cell .dow{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--green);}
  td.date-cell .dnum{font-size:15px;font-weight:800;color:var(--ink);}
  td.date-cell.weekend{background:var(--weekend);}
  td.date-cell.weekend .dow{color:var(--danger);}

  td.job-cell{
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    vertical-align:top;
    padding:5px;
    min-width:150px;
    max-width:150px;
    transition:background .1s;
  }
  tr:nth-child(even) td.job-cell{background:rgba(0,0,0,.012);}
  td.job-cell.dragover{background:var(--gold-light)!important;outline:2px dashed var(--gold);outline-offset:-2px;}
  tr.row-weekend td.job-cell{background:var(--weekend)!important;}

  .add-job-btn{
    width:100%;
    border:1.5px dashed #c3bda4;
    background:transparent;
    color:#948d70;
    border-radius:5px;
    font-size:15px;
    line-height:1;
    padding:4px 0;
    cursor:pointer;
    margin-top:2px;
  }
  .add-job-btn:hover{border-color:var(--green);color:var(--green);background:#fff;}

  .job-card{
    background:var(--card-normal);
    border:1px solid #d9d3bf;
    border-left:4px solid var(--green);
    border-radius:5px;
    padding:6px 7px;
    margin-bottom:4px;
    font-size:10px;
    line-height:1.35;
    cursor:grab;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .job-card:active{cursor:grabbing;}
  .job-card.dragging{opacity:.35;}
  .job-card.type-spare{border-left-color:#7a8f86;background:var(--card-spare);}
  .job-card.type-vacation{border-left-color:var(--danger);background:var(--card-vacation);}
  .job-card.type-note{border-left-color:var(--gold);background:var(--card-note);}
  .job-card.type-pm{border-left-color:#2a6f97;background:#e9f2f8;}
  .job-card.type-safety_inspection{border-left-color:#b5541a;background:#fbede0;}
  .job-card .maint-banner{
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;
    margin-bottom:3px;
  }
  .job-card.type-pm .maint-banner{color:#2a6f97;}
  .job-card.type-safety_inspection .maint-banner{color:#b5541a;}
  .job-card .maint-detail{font-size:9.5px;color:#5c574a;margin-bottom:2px;}
  .job-card .route{font-weight:700;color:var(--green-dark);font-size:10.5px;white-space:normal;word-break:break-word;}
  .job-card .route .arrow{color:var(--gold);margin:0 2px;}
  .job-card .meta{color:#5c574a;font-size:9px;margin-top:2px;white-space:normal;word-break:break-word;}
  .job-card .horse{font-style:italic;color:#3a3630;font-size:9px;margin-top:1px;white-space:normal;}
  .job-card .notes{color:#7a5c2e;font-size:9px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .job-card .lb-ref{
    display:inline-block;margin-top:3px;
    font-size:9px;font-weight:700;color:var(--green-dark);
    background:var(--gold-light);border-radius:4px;padding:2px 5px;
    text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }
  .job-card .lb-ref:hover{background:var(--gold);}
  .turnaround-warning{
    margin-top:4px;font-size:9px;font-weight:700;color:#8a4b00;
    background:#fdead0;border:1px solid #f0c688;border-radius:4px;
    padding:3px 6px;cursor:help;
  }
  .turnaround-warning.unverifiable{color:#6b6555;background:#efece0;border-color:#d8d2c0;}
  .turnaround-warning.not-possible{color:#fff;background:var(--danger);border-color:#7d2c22;font-weight:800;}
  .job-card.turnaround-ok{outline:2px solid #3fa66b;outline-offset:-1px;}
  .job-card.turnaround-tight{outline:2px solid #d18a00;outline-offset:-1px;}
  .job-card.turnaround-not-possible{outline:2px solid var(--danger);outline-offset:-1px;}

  .toast{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);
    background:var(--danger);color:#fff;
    padding:12px 20px;border-radius:8px;
    font-size:13.5px;font-weight:600;line-height:1.4;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
    z-index:300;max-width:520px;text-align:center;
    display:flex;align-items:center;gap:10px;
  }
  .toast .toast-close{cursor:pointer;font-weight:900;font-size:16px;line-height:1;color:rgba(255,255,255,.8);flex-shrink:0;}
  .toast .toast-close:hover{color:#fff;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(14,20,17,.55);
    display:none;align-items:center;justify-content:center;z-index:200;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:#fff;border-radius:10px;width:380px;max-width:92vw;
    padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.35);
    max-height:90vh;overflow-y:auto;
  }
  .modal h2{margin:0 0 14px;font-size:16px;color:var(--green-dark);}
  .modal label{display:block;font-size:11px;font-weight:700;color:#6b6555;text-transform:uppercase;letter-spacing:.4px;margin:10px 0 3px;}
  .modal input, .modal select, .modal textarea{
    width:100%;padding:7px 8px;border:1px solid #cfc9b8;border-radius:5px;font-size:13px;font-family:inherit;
  }
  .modal textarea{resize:vertical;min-height:44px;}
  .modal-row{display:flex;gap:8px;}
  .modal-row > div{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px;}
  .modal-actions .left{display:flex;gap:8px;}
  .btn-primary{background:var(--green-dark);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;}
  .btn-primary:hover{background:var(--green);}
  .btn-secondary{background:#ece7d8;color:var(--ink);border:none;padding:9px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px;}
  .btn-secondary:hover{background:#ddd6c0;}
  .btn-delete{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:9px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px;}
  .btn-delete:hover{background:var(--danger);color:#fff;}
</style>
</head>
<body>

<div class="topbar">
  <h1>SALLEE <span>DISPATCH</span> BOARD</h1>
  <div class="nav-group">
    <button class="btn ghost" id="prevBtn">&larr; Prev 2 Wks</button>
    <div class="range-label" id="rangeLabel"></div>
    <button class="btn ghost" id="nextBtn">Next 2 Wks &rarr;</button>
    <button class="btn ghost" id="todayBtn">This Week</button>
  </div>
  <div class="spacer"></div>
  <span class="status-note" id="authUserBadge" style="display:none;margin-right:2px;"></span>
  <button class="btn ghost" id="signInBtn">Sign in with Microsoft</button>
  <button class="btn ghost" id="signOutBtn" style="display:none;">Sign out</button>
  <button class="btn" id="exportBtn">Export JSON</button>
  <button class="btn" id="importBtn">Import JSON</button>
  <input type="file" id="importFile" accept=".json" style="display:none;">
  <span class="status-note" id="statusNote">Saved locally in this browser</span>
</div>

<div id="topScrollSync"><div id="topScrollSyncInner"></div></div>

<div class="board-wrap">
  <table class="board" id="boardTable">
    <thead>
      <tr id="regionRow"></tr>
      <tr id="headRow"></tr>
    </thead>
    <tbody id="boardBody"></tbody>
  </table>
</div>

<div class="modal-overlay" id="jobModalOverlay">
  <div class="modal">
    <h2 id="jobModalTitle">Add Job</h2>
    <label>Type</label>
    <select id="jobType">
      <option value="normal">Normal job</option>
      <option value="spare">Spare / standby</option>
      <option value="vacation">Vacation / off</option>
      <option value="note">Note only</option>
      <option value="pm">PM</option>
      <option value="safety_inspection">Safety Inspection</option>
    </select>
    <div id="technicianRow" class="modal-row" style="display:none;">
      <div>
        <label>Maintenance Time</label>
        <input id="jobMaintTime" type="time">
      </div>
      <div>
        <label>Assigned Technician</label>
        <input id="jobTechnician" placeholder="e.g. John Reyes">
      </div>
    </div>
    <label>Assign Driver</label>
    <select id="jobAssignDriver"></select>
    <div id="repeatThroughRow" class="modal-row">
      <div>
        <label>Start Date</label>
        <input type="date" id="jobStartDate">
      </div>
      <div>
        <label>End Date (optional &mdash; for a vacation stretch, etc.)</label>
        <input type="date" id="jobEndDate">
      </div>
    </div>
    <div class="modal-row">
      <div>
        <label>Origin</label>
        <select id="jobOriginSelect"><option value="">Loading tracks...</option></select>
        <input id="jobOriginOther" placeholder="Type farm/location name" style="display:none;margin-top:5px;">
        <div id="jobOriginOtherHint" style="display:none;font-size:10.5px;color:#8a5a00;margin-top:3px;"></div>
      </div>
      <div>
        <label>Origin Trainer/Farm</label>
        <input id="jobOriginFarm" placeholder="e.g. Rusty Arnold">
      </div>
    </div>
    <div class="modal-row">
      <div>
        <label>Destination</label>
        <select id="jobDestinationSelect"><option value="">Loading tracks...</option></select>
        <input id="jobDestinationOther" placeholder="Type farm/location name" style="display:none;margin-top:5px;">
        <div id="jobDestinationOtherHint" style="display:none;font-size:10.5px;color:#8a5a00;margin-top:3px;"></div>
      </div>
      <div>
        <label>Destination Trainer/Farm</label>
        <input id="jobDestinationFarm" placeholder="e.g. High Point Farm">
      </div>
    </div>
    <label>Additional Pickups/Drops (optional &mdash; reference only, doesn't affect turnaround checks)</label>
    <input id="jobAdditionalStops" placeholder="e.g. also picking up at MTH">
    <div class="modal-row">
      <div>
        <label>Leave Yard Time</label>
        <input id="jobLeaveYardTime" type="time">
      </div>
      <div>
        <label>Load Time</label>
        <input id="jobTime" type="time">
      </div>
    </div>
    <label>Load Type</label>
    <select id="jobLoadType">
      <option value="">—</option>
      <option value="stable_move">Stable Move</option>
      <option value="special">Special</option>
      <option value="mix_load">Mix Load</option>
      <option value="shuttle">Shuttle</option>
      <option value="race_and_return">Race and Return</option>
      <option value="plane">Plane</option>
    </select>
    <label>Load Board Link / Order # (optional)</label>
    <div style="display:flex;gap:6px;">
      <input id="jobLoadBoardRef" placeholder="Paste a link/order #, or browse ->" style="flex:1;">
      <button type="button" class="btn-secondary" id="lbBrowseBtn" style="white-space:nowrap;">Browse</button>
    </div>
    <div id="lbBrowsePanel" style="display:none;border:1px solid #cfc9b8;border-radius:6px;margin-top:6px;max-height:160px;overflow-y:auto;"></div>
    <label>Notes</label>
    <textarea id="jobNotes" placeholder="Special instructions..."></textarea>
    <div class="modal-actions">
      <div class="left">
        <button class="btn-delete" id="jobDeleteBtn" style="display:none;">Delete</button>
      </div>
      <div class="left">
        <button class="btn-secondary" id="jobCancelBtn">Cancel</button>
        <button class="btn-primary" id="jobSaveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="driverModalOverlay">
  <div class="modal">
    <h2 id="driverModalTitle">Add Driver / Team</h2>
    <div class="modal-row">
      <div>
        <label>Driver 1</label>
        <input id="drvName1" placeholder="e.g. PAUL Z.">
      </div>
      <div>
        <label>Driver 2 (optional)</label>
        <input id="drvName2" placeholder="e.g. JASEN">
      </div>
    </div>
    <div class="modal-row">
      <div>
        <label>Truck #</label>
        <input id="drvTruck" placeholder="e.g. 657">
      </div>
      <div>
        <label>Trailer #</label>
        <input id="drvTrailer" placeholder="e.g. 185A+">
      </div>
    </div>
    <label>Location</label>
    <select id="drvLocation">
      <option value="">— Unassigned —</option>
      <option value="KY">KY</option>
      <option value="FL">FL</option>
      <option value="NY">NY</option>
    </select>
    <div class="modal-actions">
      <div class="left">
        <button class="btn-delete" id="drvDeleteBtn" style="display:none;">Remove</button>
      </div>
      <div class="left">
        <button class="btn-secondary" id="drvCancelBtn">Cancel</button>
        <button class="btn-primary" id="drvSaveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmOverlay">
  <div class="modal">
    <h2>Please confirm</h2>
    <p id="confirmMessage" style="font-size:13px;color:#3a362c;line-height:1.5;margin:0 0 4px;"></p>
    <div class="modal-actions">
      <div class="left"></div>
      <div class="left">
        <button class="btn-secondary" id="confirmCancelBtn">Cancel</button>
        <button class="btn-delete" id="confirmOkBtn">Remove</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script>

];

let jobIdCounter = jobs.reduce((m,j)=>Math.max(m, parseInt((j.id||'j0').replace('j',''))||0), 0) + 1;

function mondayOf(d){
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day===0?-6:1)-day;
  dt.setDate(dt.getDate()+diff);
  dt.setHours(0,0,0,0);
  return dt;
}
let weekStart = new Date(localStorage.getItem(LS_WEEKSTART) || mondayOf(new Date()).toISOString());
weekStart = mondayOf(weekStart);

function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function getDateRange(){
  const arr=[];
  for(let i=0;i<14;i++){
    const d = new Date(weekStart);
    d.setDate(d.getDate()+i);
    arr.push(d);
  }
  return arr;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function dateFromStr(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function driverLabel(drv){
  if(!drv) return '';
  const names = [drv.name1, drv.name2].filter(Boolean).join(' / ');
  const truckPart = [drv.truck, drv.trailer].filter(Boolean).join('/');
  return names + (truckPart ? ' · '+truckPart : '');
}
function formatTimeDisplay(t){
  if(!t) return '';
  const parts = t.split(':');
  let h = parseInt(parts[0], 10);
  const m = parts[1] || '00';
  if(isNaN(h)) return t;
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if(h === 0) h = 12;
  return `${h}:${m} ${ampm}`;
}
function findTimeConflict(driverId, date, time, excludeIds){
  if(!driverId || !time) return null;
  return jobs.find(j => j.assignedDriverId===driverId && j.date===date && j.time===time && !excludeIds.includes(j.id)) || null;
}

/* ============ TURNAROUND-TIME (real Google-computed drive times) ============
   No driver roster/mapping needed here at all - this only ever looks at
   Origin/Destination text and which jobs already sit under the same driver
   column, sorted by actual date+time. */
const TURNAROUND_BUFFER_MINUTES = 120; // 2hr for cleaning/unloading/loading etc.
const TURNAROUND_SAFE_GAP_MINUTES = 2880; // 48hrs - beyond this, no realistic drive time could be a problem, so skip verification entirely
const DRIVE_TIMES_URL = 'https://canumanu.github.io/SALLEE-DISPATCH-BOARD/drive_times.json';
let driveTimesData = null;
let locationNameToCode = {};

async function loadDriveTimes(){
  try{
    const res = await fetch(DRIVE_TIMES_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    driveTimesData = await res.json();
    locationNameToCode = {};
    (driveTimesData.locations||[]).forEach(loc=>{
      if(loc.code) locationNameToCode[loc.code.trim().toLowerCase()] = loc.code;
      if(loc.name) locationNameToCode[loc.name.trim().toLowerCase()] = loc.code;
    });
    populateLocationSelects();
    render(); // refresh so any already-drawn cards pick up real data
  }catch(err){
    console.warn('Could not load drive_times.json - location dropdowns will only offer "Other" until it loads.', err.message);
  }
}

const OTHER_LOCATION_VALUE = '__other__';

function populateLocationSelects(){
  const sortedLocations = [...(driveTimesData ? driveTimesData.locations||[] : [])]
    .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const opts = sortedLocations
    .map(loc=>`<option value="${escapeHtml(loc.code)}">${escapeHtml(loc.code)} \u2014 ${escapeHtml(loc.name||'')}</option>`)
    .join('');
  const fullHtml = opts + `<option value="${OTHER_LOCATION_VALUE}">Other / Farm (type manually)</option>`;
  ['jobOriginSelect','jobDestinationSelect'].forEach(id=>{
    const sel = document.getElementById(id);
    const prevValue = sel.value;
    sel.innerHTML = fullHtml;
    if(prevValue && prevValue !== '') sel.value = prevValue;
  });
}

// Sets the select+other-input pair to reflect a stored location string (a
// known code, or free text like a farm name).
function setLocationField(prefix, value){
  const sel = document.getElementById('job'+prefix+'Select');
  const other = document.getElementById('job'+prefix+'Other');
  const hint = document.getElementById('job'+prefix+'OtherHint');

  if(code){

    other.value = '';
    hint.style.display = 'none';
  } else {

    other.style.display = '';
    other.value = value || '';
    const matches = findPossibleLocationMatches(other.value);
    if(matches && matches.length){
      hint.innerHTML = `\u26A0\uFE0F Looks similar to a known track: <b>${matches.map(m=>escapeHtml(m.code+' \u2014 '+m.name)).join(', ')}</b> \u2014 pick it from the dropdown above for accurate drive-time checking.`;
      hint.style.display = '';
    } else {
      hint.style.display = 'none';
    }
  }
}

const LOCATION_HINT_STOPWORDS = new Set(['the','of','at','in','on','and','farm','training','center','centre','international','airport','park','course','quarantine','import']);
function findPossibleLocationMatches(text){
  if(!driveTimesData || !text || !text.trim()) return null;
  const norm = normLoc(text);
  const typedWords = norm.split(/[^a-z0-9]+/).filter(w=>w.length>=2 && !LOCATION_HINT_STOPWORDS.has(w));
  const matches = [];
  (driveTimesData.locations||[]).forEach(loc=>{
    const codeMatch = norm === loc.code.toLowerCase();
    const nameMatch = norm === (loc.name||'').toLowerCase();
    const nameWords = (loc.name||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>=2 && !LOCATION_HINT_STOPWORDS.has(w));
    const overlap = typedWords.length && typedWords.some(w=>nameWords.includes(w));
    if(codeMatch || nameMatch || overlap) matches.push(loc);
  });
  return matches.length ? matches : null;
}

function normLoc(s){ return (s||'').trim().toLowerCase(); }

// Regional shorthand fallback: when a dispatcher types a farm name that just
// mentions a region (e.g. "Gainesway Farm, KY") rather than picking an exact
// location, fall back to a representative hub address for that region. This
// is a deliberate approximation, not a real per-farm address - it trades a
// bit of precision for closing the "can't verify" gap on routine regional
// farms, on the assumption that farms within the same region are close
// enough together not to meaningfully change the turnaround math.
const KEYWORD_HUB_MAP = [
  {regex: /\bsallee\s*yard\b/i, hubCode: 'Barn'}, // "Sallee Yard" is what dispatchers actually type for this location
  {regex: /\bky\b/i, hubCode: 'Barn'},   // Sallee Lay Over - KY hub
  {regex: /\bocala\b/i, hubCode: 'Ocala'},
  {regex: /\bsar\b/i, hubCode: 'SAR'},   // Saratoga - reused as the regional hub
];

function resolveLocationCode(text){
  if(!text) return null;
  const direct = locationNameToCode[normLoc(text)];
  if(direct) return direct;
  for(const {regex, hubCode} of KEYWORD_HUB_MAP){
    if(regex.test(text)) return hubCode;
  }
  return null;
}

function lookupDriveMinutes(a, b){
  if(!a || !b || !driveTimesData) return null;
  const codeA = resolveLocationCode(a);
  const codeB = resolveLocationCode(b);
  if(!codeA || !codeB) return null;
  const entry = driveTimesData.matrix[codeA] && driveTimesData.matrix[codeA][codeB];
  return entry ? entry.minutes : null;
}
function timeToMinutes(t){
  if(!t) return null;
  const parts = t.split(':').map(Number);
  if(isNaN(parts[0])) return null;
  return parts[0]*60 + (parts[1]||0);
}
function dateTimeToAbsMinutes(dateStr, timeStr){
  const tMin = timeToMinutes(timeStr);
  if(tMin===null) return null;
  const d = dateFromStr(dateStr);
  return Math.round(d.getTime()/60000) + tMin;
}
function absMinutesToDateTimeDisplay(absMin){
  const d = new Date(absMin*60000);
  const dateLabel = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  const timeLabel = formatTimeDisplay(`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`);
  return `${dateLabel}, ${timeLabel}`;
}
function formatMinutesDuration(mins){
  if(mins < 60) return `${mins}m`;
  const h = Math.floor(mins/60), m = mins%60;
  return m ? `${h}h ${m}m` : `${h}h`;
}

const TURNAROUND_NOT_POSSIBLE_THRESHOLD_MINUTES = 240; // beyond 4 hours late, it's rejected outright

// Always returns a status object: 'none' (nothing to check against), 'unverifiable'
// (unknown location), 'ok' (verified, real margin), 'tight' (doable but 0-4hrs
// short), or 'not_possible' (more than 4hrs short - rejected).
function getTurnaroundWarning(job){
  if(!job.assignedDriverId || !job.time) return {status:'none'};
  const jobDT = dateTimeToAbsMinutes(job.date, job.time);
  if(jobDT===null) return {status:'none'};

  const driverJobs = jobs.filter(j=>j.assignedDriverId===job.assignedDriverId && j.time && j.id!==job.id);
  let prevJob = null, prevDT = null;
  driverJobs.forEach(j=>{
    const jDT = dateTimeToAbsMinutes(j.date, j.time);
    if(jDT!==null && jDT < jobDT && (prevDT===null || jDT > prevDT)){
      prevJob = j; prevDT = jDT;
    }
  });
  if(!prevJob) return {status:'ok'}; // nothing precedes it, so nothing time-wise can stop it

  const rawGapMinutes = jobDT - prevDT;
  if(rawGapMinutes >= TURNAROUND_SAFE_GAP_MINUTES){
    // Gap is already so large that no realistic drive time could be an issue -
    // don't even bother trying to verify locations, just call it fine.
    return {status:'ok', prevJob, marginMinutes: rawGapMinutes};
  }

  const legMinutes = lookupDriveMinutes(prevJob.origin, prevJob.destination);
  const nextLegMinutes = lookupDriveMinutes(prevJob.destination, job.origin);
  if(legMinutes===null || nextLegMinutes===null){
    return { status:'unverifiable', prevJob,
      reason: legMinutes===null
        ? `This driver's PRIOR trip (${prevJob.date}) goes "${prevJob.origin||'?'}" \u2192 "${prevJob.destination||'?'}" \u2014 that route isn't in our track list yet (likely a farm/trainer). This card's own locations are fine; it's the earlier trip that can't be checked.`
        : `This driver's PRIOR trip (${prevJob.date}) ends at "${prevJob.destination||'?'}", which isn't in our track list yet (likely a farm/trainer) \u2014 so the drive time to get here can't be calculated. This card's own locations are fine.` };
  }
  const earliestReadyDT = prevDT + legMinutes + TURNAROUND_BUFFER_MINUTES + nextLegMinutes;
  if(jobDT < earliestReadyDT){
    const shortByMinutes = earliestReadyDT - jobDT;
    return {
      status: shortByMinutes > TURNAROUND_NOT_POSSIBLE_THRESHOLD_MINUTES ? 'not_possible' : 'tight',
      shortByMinutes,
      earliestReadyAbs: earliestReadyDT,
      prevJob
    };
  }
  return {status:'ok', prevJob, marginMinutes: jobDT - earliestReadyDT};
}

function getSortedDrivers(){
  const sorted = [];
  REGION_ORDER.forEach(region=>{
    drivers.forEach(d=>{
      if((d.location||'')===region) sorted.push(d);
    });
  });
  return sorted;
}
function getRegionGroups(sortedDrivers){
  const groups = [];
  sortedDrivers.forEach(d=>{
    const region = d.location || '';
    const last = groups[groups.length-1];
    if(last && last.region===region){ last.count++; }
    else{ groups.push({region, count:1}); }
  });
  return groups;
}

function render(){
  const sortedDrivers = getSortedDrivers();
  renderRegionRow(sortedDrivers);
  renderHeadRow(sortedDrivers);
  renderBoard(sortedDrivers);

}

function renderHeadRow(sortedDrivers){

function renderBoard(sortedDrivers){
  const body = document.getElementById('boardBody');
  body.innerHTML = '';
  const dates = getDateRange();

  dates.forEach(d=>{
    const dateStr = fmtDate(d);
    const dow = d.getDay();
    const isWeekend = dow===0 || dow===6;
    const tr = document.createElement('tr');
    if(isWeekend) tr.className = 'row-weekend';

    const dateTd = document.createElement('td');
    dateTd.className = 'date-cell' + (isWeekend?' weekend':'');
    dateTd.innerHTML = `<div class="dow">${DAY_NAMES[dow]}</div><div class="dnum">${d.getMonth()+1}/${d.getDate()}</div>`;
    tr.appendChild(dateTd);

    sortedDrivers.forEach(drv=>{
      const td = document.createElement('td');
      td.className = 'job-cell';
      td.dataset.date = dateStr;
      td.dataset.driverId = drv.id;

      const cellJobs = jobs.filter(j=>j.date===dateStr && j.assignedDriverId===drv.id)
                            .sort((a,b)=>(a.order||0)-(b.order||0));
      cellJobs.forEach(job=>td.appendChild(buildJobCard(job)));

      const addBtn = document.createElement('button');
      addBtn.className = 'add-job-btn';
      addBtn.textContent = '+';
      addBtn.title = 'Add job for this driver/date';
      addBtn.addEventListener('click', ()=>openJobModal(null, dateStr, drv.id));
      td.appendChild(addBtn);

      attachDropZone(td);
      tr.appendChild(td);
    });

    body.appendChild(tr);
  });
}

function buildJobCard(job){
  const card = document.createElement('div');
  card.className = 'job-card type-' + (job.type||'normal');
  card.draggable = true;
  card.dataset.jobId = job.id;

  let routeHtml = '';
  if(job.origin || job.destination){
    routeHtml = `<div class="route">${escapeHtml(job.origin||'?')}<span class="arrow">&rarr;</span>${escapeHtml(job.destination||'?')}</div>`;
  }
  let metaBits = [];
  if(job.leaveYardTime) metaBits.push('Leave ' + formatTimeDisplay(job.leaveYardTime));
  if(job.time) metaBits.push('Load ' + formatTimeDisplay(job.time));
  const farmBits = [job.originFarm, job.destinationFarm].filter(Boolean).join(' → ');
  if(farmBits) metaBits.push(farmBits);
  const metaHtml = metaBits.length ? `<div class="meta">${escapeHtml(metaBits.join(' · '))}</div>` : '';
  const additionalStopsHtml = job.additionalStops ? `<div class="meta" style="font-style:italic;" title="${escapeHtml(job.additionalStops)}">+ ${escapeHtml(job.additionalStops)}</div>` : '';
  const horseHtml = job.loadType ? `<div class="horse">${escapeHtml(LOAD_TYPE_LABELS[job.loadType]||job.loadType)}</div>` : '';
  const notesHtml = job.notes ? `<div class="notes" title="${escapeHtml(job.notes)}">${escapeHtml(job.notes)}</div>` : '';

  let lbRefHtml = '';
  if(job.loadBoardRef){
    const isUrl = /^https?:\/\//i.test(job.loadBoardRef.trim());
    if(isUrl){
      lbRefHtml = `<a class="lb-ref" href="${escapeHtml(job.loadBoardRef.trim())}" target="_blank" rel="noopener" title="Open in Load Board">&#128279; Load Board</a>`;
    } else {
      lbRefHtml = `<span class="lb-ref" title="Load Board reference">&#128279; ${escapeHtml(job.loadBoardRef)}</span>`;
    }
  }

  let body = '';
  if(job.type === 'pm' || job.type === 'safety_inspection'){
    const label = MAINTENANCE_LABELS[job.type] || job.type;
    const bits = [];
    if(job.maintTime) bits.push(formatTimeDisplay(job.maintTime));
    if(job.technician) bits.push('Tech: ' + job.technician);
    body += `<div class="maint-banner">${escapeHtml(label)}</div>`;
    if(bits.length) body += `<div class="maint-detail">${escapeHtml(bits.join(' · '))}</div>`;
  }
  body += routeHtml + additionalStopsHtml + metaHtml + horseHtml + notesHtml + lbRefHtml;
  if(!body){ body = `<div class="meta">(click to edit)</div>`; }
  card.innerHTML = body;

  card.addEventListener('click', (e)=>{
    if(e.target.closest('.lb-ref')) return;
    if(e.target.closest('.turnaround-warning')) return;
    openJobModal(job.id);
  });
  card.addEventListener('dragstart', (e)=>{
    e.dataTransfer.setData('application/x-job', job.id);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(()=>card.classList.add('dragging'), 0);
  });
  card.addEventListener('dragend', ()=>card.classList.remove('dragging'));

  const warning = getTurnaroundWarning(job);
  if(warning.status === 'ok'){
    card.classList.add('turnaround-ok');
  } else if(warning.status === 'unverifiable'){
    const warnEl = document.createElement('div');
    warnEl.className = 'turnaround-warning unverifiable';
    warnEl.textContent = `? Can't verify turnaround (tap for why)`;
    warnEl.title = warning.reason;
    warnEl.addEventListener('click', (e)=>{
      e.stopPropagation();
      showToast(warning.reason);
    });
    card.appendChild(warnEl);
  } else if(warning.status === 'not_possible'){
    card.classList.add('turnaround-not-possible');
    const warnEl = document.createElement('div');
    warnEl.className = 'turnaround-warning not-possible';
    warnEl.textContent = `\u26D4 Not possible \u2014 ${formatMinutesDuration(warning.shortByMinutes)} short`;
    warnEl.title = `Based on real drive-time data, this truck can't realistically be ready until about ${absMinutesToDateTimeDisplay(warning.earliestReadyAbs)} \u2014 more than 4 hours beyond this load's start time. Not doable as scheduled.`;
    card.appendChild(warnEl);
  } else if(warning.status === 'tight'){
    card.classList.add('turnaround-tight');
    const warnEl = document.createElement('div');
    warnEl.className = 'turnaround-warning';
    warnEl.textContent = `\u23F1 Tight turnaround \u2014 ${formatMinutesDuration(warning.shortByMinutes)} short`;
    warnEl.title = `Based on real drive-time data, this truck isn't ready until about ${absMinutesToDateTimeDisplay(warning.earliestReadyAbs)}. Doable, but could run late.`;
    card.appendChild(warnEl);
  }
  // status 'none' - nothing to check against yet (no prior job that day) - stays neutral, no outline

  return card;
}

function attachDropZone(td){
  td.addEventListener('dragover', (e)=>{
    if(e.dataTransfer.types.includes('application/x-job')){
      e.preventDefault();
      td.classList.add('dragover');
    }
  });
  td.addEventListener('dragleave', ()=>td.classList.remove('dragover'));
  td.addEventListener('drop', (e)=>{
    td.classList.remove('dragover');
    const jobId = e.dataTransfer.getData('application/x-job');
    if(!jobId) return;
    e.preventDefault();
    const job = jobs.find(j=>j.id===jobId);
    if(!job) return;

    const targetDate = td.dataset.date;
    const targetDriverId = td.dataset.driverId;

    const conflict = findTimeConflict(targetDriverId, targetDate, job.time, [job.id]);
    if(conflict){
      const drv = drivers.find(d=>d.id===targetDriverId);
      showToast(`${drv ? driverLabel(drv) : 'This driver/team'} is already assigned to a trip at ${formatTimeDisplay(job.time)} on this date (${conflict.origin||'?'} \u2192 ${conflict.destination||'?'}). Pick a different time or driver.`);
      return;
    }

    job.date = targetDate;
    job.assignedDriverId = targetDriverId;
    const siblingMax = jobs.filter(j=>j.date===targetDate && j.assignedDriverId===targetDriverId && j.id!==job.id)
                            .reduce((m,j)=>Math.max(m, j.order||0), 0);
    job.order = siblingMax + 1;
    saveAll();
    render();
    syncJobsUpsert([job]);
  });
}

const LOAD_BOARD_ORDERS_URL = 'https://canumanu.github.io/SALLEE-LOAD-BOARD/data/orders.json';
let loadBoardOrdersCache = null;
async function fetchLoadBoardOrders(){
  if(loadBoardOrdersCache) return loadBoardOrdersCache;
  const res = await fetch(LOAD_BOARD_ORDERS_URL, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  loadBoardOrdersCache = Array.isArray(data) ? data : (data.orders || data.Orders || []);
  return loadBoardOrdersCache;
}
function pickField(obj, candidates){
  for(const key of candidates){
    if(obj[key] !== undefined && obj[key] !== null && obj[key] !== '') return obj[key];
  }
  return '';
}
function describeOrder(order){
  const origin = pickField(order, ['origin','Origin','ORIGIN']);
  const destination = pickField(order, ['destination','Destination','DESTINATION']);
  const date = pickField(order, ['date','Date','tripDate','TripDate','pickupDate','PickupDate']);
  const id = pickField(order, ['id','Id','ID','orderId','OrderID','orderNumber']);
  let horses = pickField(order, ['horses','Horses']);
  let horseLabel = '';
  if(Array.isArray(horses)) horseLabel = horses.map(h=>(h && (h.name||h.Name))||'').filter(Boolean).join(', ');
  else if(typeof horses === 'string') horseLabel = horses;
  if(!horseLabel) horseLabel = pickField(order, ['HORSE NAME(S)','horseNames','HorseNames']);
  const label = `${origin||'?'} \u2192 ${destination||'?'}${date? ' · '+date:''}${horseLabel? ' · '+horseLabel:''}`;
  return {id, date, origin, destination, horseLabel, label};
}

    origin: getLocationField('Origin'),

    notes: document.getElementById('jobNotes').value.trim(),
  };
  const selectedDriverId = document.getElementById('jobAssignDriver').value || null;
  let savedJobs = [];

  if(editingJobId){
    const job = jobs.find(j=>j.id===editingJobId);
    if(selectedDriverId){
      const conflict = findTimeConflict(selectedDriverId, job.date, data.time, [job.id]);
      if(conflict){
        const drv = drivers.find(d=>d.id===selectedDriverId);
        showToast(`${drv ? driverLabel(drv) : 'This driver/team'} is already assigned to a trip at ${formatTimeDisplay(data.time)} on ${job.date} (${conflict.origin||'?'} \u2192 ${conflict.destination||'?'}). Pick a different time or driver.`);
        return;
      }

    Object.assign(job, data);

    savedJobs = [job];
  } else {
    const startDate = document.getElementById('jobStartDate').value || pendingDate;
    const endDate = document.getElementById('jobEndDate').value;
    const datesToCreate = [];
    if(endDate && endDate > startDate){
      let cursor = dateFromStr(startDate);
      const endD = dateFromStr(endDate);
      let guard = 0;
      while(cursor <= endD && guard < 60){
        datesToCreate.push(fmtDate(cursor));
        cursor.setDate(cursor.getDate()+1);
        guard++;
      }
    } else {
      datesToCreate.push(startDate);
    }

    if(selectedDriverId){
      for(const dStr of datesToCreate){
        const conflict = findTimeConflict(selectedDriverId, dStr, data.time, []);
        if(conflict){
          const drv = drivers.find(d=>d.id===selectedDriverId);
          showToast(`${drv ? driverLabel(drv) : 'This driver/team'} is already assigned to a trip at ${formatTimeDisplay(data.time)} on ${dStr} (${conflict.origin||'?'} \u2192 ${conflict.destination||'?'}). Nothing was created \u2014 pick a different time or driver.`);

      const maxOrder = jobs.filter(j=>j.date===dStr && j.assignedDriverId===selectedDriverId).reduce((m,j)=>Math.max(m,j.order||0),0);
      const newJob = {id:'j'+(jobIdCounter++), date:dStr, assignedDriverId:selectedDriverId, order:maxOrder+1, ...data};
      jobs.push(newJob);

  closeJobModal();

});

/* ============================================================
   MICROSOFT 365 SIGN-IN + SHAREPOINT SYNC
   ------------------------------------------------------------
   Multi-user backing store. Local browser storage above remains
   a fast cache / offline fallback - the board always renders from
   `drivers`/`jobs` regardless of sign-in state. Once signed in,
   those two arrays get replaced by what's on SharePoint, and every
   add/edit/delete/drag-drop also pushes to SharePoint. Two
   permission tiers (view vs. edit) are enforced by SharePoint's own
   Visitor/Member site roles, not by this app - a write that comes
   back 403 flips the app into view-only mode.

   NOTE: Import JSON stays local-only (does not push to SharePoint)
   to avoid an accidental bulk overwrite of the shared board from a
   backup file. Use it for restoring a personal backup, not for
   pushing changes to the team.
   ============================================================ */

async function initAuth(){
  if(typeof msal === 'undefined'){
    updateSyncStatus('Sign-in unavailable (auth library failed to load) — working locally', true);
    return;
  }
  try{
    msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
    await msalInstance.initialize();
    const response = await msalInstance.handleRedirectPromise();
    if(response && response.account){
      currentAccount = response.account;
    } else {
      const accounts = msalInstance.getAllAccounts();
      if(accounts.length > 0) currentAccount = accounts[0];
    }
    if(currentAccount){
      msalInstance.setActiveAccount(currentAccount);
      updateAuthUI(true);
      await startSyncedSession();
    } else {
      updateAuthUI(false);
    }
  }catch(err){
    console.error('Auth init failed', err);
    updateSyncStatus('Sign-in error — working locally', true);
  }
}

async function getAccessToken(){
  const account = currentAccount || (msalInstance && msalInstance.getActiveAccount());
  if(!msalInstance || !account) throw new Error('Not signed in');
  try{
    const result = await msalInstance.acquireTokenSilent({scopes: GRAPH_SCOPES, account});
    return result.accessToken;
  }catch(err){
    if(err instanceof msal.InteractionRequiredAuthError){
      await msalInstance.acquireTokenRedirect({scopes: GRAPH_SCOPES, account});
      return null; // navigates away; execution stops here
    }
    throw err;
  }
}

async function graphFetch(pathOrUrl, options){
  const token = await getAccessToken();
  if(!token) throw new Error('No access token');
  const url = pathOrUrl.startsWith('http') ? pathOrUrl : GRAPH_BASE + pathOrUrl;
  const res = await fetch(url, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
      ...((options && options.headers) || {})
    }
  });
  if(!res.ok){
    let bodyText = '';
    try{ bodyText = await res.text(); }catch(e){}
    const err = new Error(`Graph API ${res.status}: ${bodyText}`);
    err.status = res.status;
    throw err;
  }
  if(res.status === 204) return null;
  return res.json();
}

async function resolveSite(){
  if(siteId) return siteId;
  const cached = sessionStorage.getItem('sallee_sp_site_id');
  if(cached){ siteId = cached; return siteId; }
  const site = await graphFetch(`/sites/${SHAREPOINT_HOSTNAME}:${SHAREPOINT_SITE_PATH}`);
  siteId = site.id;
  sessionStorage.setItem('sallee_sp_site_id', siteId);
  return siteId;
}

async function findOrCreateList(name, columns){
  const sid = await resolveSite();
  const cacheKey = 'sallee_sp_list_' + name;
  const cached = sessionStorage.getItem(cacheKey);
  if(cached) return cached;
  // NOTE: deliberately not using ?$filter=displayName eq '...' here - Graph's
  // SharePoint-lists endpoint doesn't reliably support that filter and can
  // return a misleading 403 instead of just failing the filter. A site has
  // only a handful of lists, so fetching all and matching client-side is
  // cheap and far more reliable.
  const allLists = await graphFetch(`/sites/${sid}/lists`);
  const existingMatch = (allLists.value || []).find(l => l.displayName === name);
  if(existingMatch){
    sessionStorage.setItem(cacheKey, existingMatch.id);
    return existingMatch.id;
  }
  const created = await graphFetch(`/sites/${sid}/lists`, {
    method:'POST',
    body: JSON.stringify({
      displayName: name,
      columns: columns,
      list: {template:'genericList'}
    })
  });
  sessionStorage.setItem(cacheKey, created.id);
  return created.id;
}

async function spListItems(listId){
  const sid = await resolveSite();
  const results = [];
  let url = `/sites/${sid}/lists/${listId}/items?expand=fields&$top=200`;
  while(url){
    const page = await graphFetch(url);
    results.push(...(page.value||[]));
    url = page['@odata.nextLink'] || null;
  }
  return results;
}
async function spCreateItem(listId, fields){
  const sid = await resolveSite();
  return graphFetch(`/sites/${sid}/lists/${listId}/items`, {
    method:'POST',
    body: JSON.stringify({fields})
  });
}
async function spUpdateItem(listId, itemId, fields){
  const sid = await resolveSite();
  return graphFetch(`/sites/${sid}/lists/${listId}/items/${itemId}/fields`, {
    method:'PATCH',
    body: JSON.stringify(fields)
  });
}
async function spDeleteItem(listId, itemId){
  const sid = await resolveSite();
  return graphFetch(`/sites/${sid}/lists/${listId}/items/${itemId}`, {method:'DELETE'});
}

function driverToFields(drv){
  return {
    Title: drv.name1 || drv.id,
    LocalId: drv.id,
    Name1: drv.name1||'',
    Name2: drv.name2||'',
    Truck: drv.truck||'',
    Trailer: drv.trailer||'',
    Location: drv.location||''
  };
}
function fieldsToDriver(item){
  const f = item.fields || {};
  return {
    id: f.LocalId,
    name1: f.Name1||'',
    name2: f.Name2||'',
    truck: f.Truck||'',
    trailer: f.Trailer||'',
    location: f.Location||'',
    _spItemId: item.id
  };
}
function jobToFields(job){
  return {
    Title: `${job.origin||'?'} -> ${job.destination||'?'}`.slice(0,255),
    LocalId: job.id,
    JobDate: job.date||'',
    AssignedDriverId: job.assignedDriverId||'',
    JobOrder: job.order||0,
    JobType: job.type||'normal',
    MaintTime: job.maintTime||'',
    Technician: job.technician||'',
    Origin: job.origin||'',
    OriginFarm: job.originFarm||'',
    Destination: job.destination||'',
    DestinationFarm: job.destinationFarm||'',
    AdditionalStops: job.additionalStops||'',
    LeaveYardTime: job.leaveYardTime||'',
    LoadTime: job.time||'',
    LoadType: job.loadType||'',
    LoadBoardRef: job.loadBoardRef||'',
    Notes: job.notes||''
  };
}
function fieldsToJob(item){
  const f = item.fields || {};
  return {
    id: f.LocalId,
    date: f.JobDate||'',
    assignedDriverId: f.AssignedDriverId||null,
    order: Number(f.JobOrder)||0,
    type: f.JobType||'normal',
    maintTime: f.MaintTime||'',
    technician: f.Technician||'',
    origin: f.Origin||'',
    originFarm: f.OriginFarm||'',
    destination: f.Destination||'',
    destinationFarm: f.DestinationFarm||'',
    additionalStops: f.AdditionalStops||'',
    leaveYardTime: f.LeaveYardTime||'',
    time: f.LoadTime||'',
    loadType: f.LoadType||'',
    loadBoardRef: f.LoadBoardRef||'',
    notes: f.Notes||'',
    _spItemId: item.id
  };
}

async function seedListToSharePoint(listId, localArray, mapFn){
  for(const item of localArray){
    try{
      const created = await spCreateItem(listId, mapFn(item));
      item._spItemId = created.id;
    }catch(e){ console.error('Seed failed for', item.id, e); }
  }
}

async function pullFromSharePoint(){
  const [driverItems, jobItems] = await Promise.all([
    spListItems(driversListId),
    spListItems(jobsListId)
  ]);

  if(driverItems.length){
    drivers = driverItems.map(fieldsToDriver).filter(d=>d.id);
  } else if(drivers.length){
    await seedListToSharePoint(driversListId, drivers, driverToFields);
  }

  if(jobItems.length){
    jobs = jobItems.map(fieldsToJob).filter(j=>j.id);
  } else if(jobs.length){
    await seedListToSharePoint(jobsListId, jobs, jobToFields);
  }

  jobIdCounter = jobs.reduce((m,j)=>Math.max(m, parseInt((j.id||'j0').replace('j',''))||0), 0) + 1;
  saveAll();
  render();
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    const anyModalOpen = document.getElementById('jobModalOverlay').classList.contains('open')
      || document.getElementById('driverModalOverlay').classList.contains('open');
    if(anyModalOpen) return;
    try{
      await pullFromSharePoint();
      updateSyncStatus('Synced with SharePoint · ' + new Date().toLocaleTimeString());
    }catch(err){
      console.warn('Background sync failed', err);
    }
  }, 45000);
}

async function startSyncedSession(){
  updateSyncStatus('Connecting to SharePoint…');
  try{
    driversListId = await findOrCreateList(DRIVERS_LIST_NAME, DRIVERS_COLUMNS);
    jobsListId = await findOrCreateList(JOBS_LIST_NAME, JOBS_COLUMNS);
    await pullFromSharePoint();
    syncEnabled = true;
    isViewOnly = false;
    updateSyncStatus('Synced with SharePoint · ' + new Date().toLocaleTimeString());
    startPolling();
  }catch(err){
    console.error('SharePoint sync failed', err);
    updateSyncStatus('Could not connect to SharePoint — showing locally saved data', true);
  }
}

function handleSyncError(err, actionDesc){
  console.error('Sync error:', err);
  if(err && err.status === 403){
    isViewOnly = true;
    updateSyncStatus('View-only access — changes are not saved to SharePoint', true);
    showToast("You have view-only access to this board, so this change wasn't saved to SharePoint (it's kept only on this device). Ask your dispatch admin for edit access if you need to make changes.");
  } else {
    updateSyncStatus('Sync error — change saved locally only', true);
    showToast(`Couldn't ${actionDesc} to SharePoint (offline or connection issue). It's saved on this device and will sync once reconnected.`);
  }
}

async function syncJobsUpsert(jobList){
  if(!syncEnabled) return;
  for(const job of jobList){
    try{
      if(job._spItemId){
        await spUpdateItem(jobsListId, job._spItemId, jobToFields(job));
      } else {
        const created = await spCreateItem(jobsListId, jobToFields(job));
        job._spItemId = created.id;
        saveAll();
      }
      updateSyncStatus('Synced with SharePoint · ' + new Date().toLocaleTimeString());
    }catch(err){
      handleSyncError(err, 'save this job');
    }
  }
}
async function syncJobDelete(job){
  if(!syncEnabled || !job._spItemId) return;
  try{
    await spDeleteItem(jobsListId, job._spItemId);
    updateSyncStatus('Synced with SharePoint · ' + new Date().toLocaleTimeString());
  }catch(err){
    handleSyncError(err, 'delete this job');
  }
}
async function syncDriverUpsert(drv){
  if(!syncEnabled) return;
  try{
    if(drv._spItemId){
      await spUpdateItem(driversListId, drv._spItemId, driverToFields(drv));
    } else {
      const created = await spCreateItem(driversListId, driverToFields(drv));
      drv._spItemId = created.id;
      saveAll();
    }
    updateSyncStatus('Synced with SharePoint · ' + new Date().toLocaleTimeString());
  }catch(err){
    handleSyncError(err, 'save this driver');
  }
}
async function syncDriverDelete(drv){
  if(!syncEnabled || !drv._spItemId) return;
  try{
    await spDeleteItem(driversListId, drv._spItemId);
    updateSyncStatus('Synced with SharePoint · ' + new Date().toLocaleTimeString());
  }catch(err){
    handleSyncError(err, 'remove this driver');
  }
}
